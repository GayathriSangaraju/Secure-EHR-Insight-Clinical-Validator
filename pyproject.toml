[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secure-ehr-insight"
version = "0.1.0"
description = "Zero-trust RAG demo for querying EHR data with PHI redaction and guardrails"
readme = "readme.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Gayathri Sangaraju" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# PHI redaction (Presidio + spaCy). Also run `python -m spacy download en_core_web_lg`.
pii = ["presidio-analyzer>=2.2", "presidio-anonymizer>=2.2", "spacy>=3.7"]
# Model-serving stack: needed by the API process and the embedding job.
ml = ["sentence-transformers>=3.0", "nemoguardrails>=0.10"]
# Needed by scripts/ingest_baseline_data.py and scripts/generate_embeddings.py.
data = ["pandas>=2.2", "tqdm>=4.66"]
ui = ["streamlit>=1.35", "requests>=2.31"]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6", "pre-commit>=3.7"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"src.database" = ["migrations/*.sql"]
"src.guardrails" = ["*.co", "*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
