# Local demo stack: Postgres+pgvector, migrations, API, UI.
# Run from the repository root (see deploy/local/README.md):
#   docker compose -f deploy/local/docker-compose.yml --env-file .env up --build -d
name: secure-ehr

x-db-env: &db-env
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-clinical_db}
  DB_USER: ${DB_USER:-clinical}
  DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}

x-api-build: &api-build
  context: ../..
  dockerfile: deploy/local/Dockerfile
  args:
    EXTRAS: ml,pii,data

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${DB_NAME:-clinical_db}
      POSTGRES_USER: ${DB_USER:-clinical}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: secure-ehr-api:local
    build: *api-build
    command: ["python", "scripts/migrate.py"]
    environment: *db-env
    depends_on:
      db:
        condition: service_healthy

  api:
    image: secure-ehr-api:local
    build: *api-build
    environment:
      <<: *db-env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AUDIT_HASH_KEY: ${AUDIT_HASH_KEY:-}
    volumes:
      - ../../data:/app/data:ro
      - hf_cache:/home/app/.cache/huggingface
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s # model loading

  ui:
    build:
      context: ../..
      dockerfile: deploy/local/Dockerfile
      args:
        EXTRAS: ui
    command: ["streamlit", "run", "src/ui/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      API_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  hf_cache:
